name: Action Build Samsung Galaxy A23 4G

on:
  workflow_call:
  workflow_dispatch:

env:
  # Device env
  DEVICE_NAME : "SM-A235F"
  DEVICE_CODENAME : "a23nsxx"

  CUSTOM_CMDS : "CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-android- CROSS_COMPILE_ARM32=arm-linux-androideabi-"
  EXTRA_CMDS : "CC=clang"
  KERNEL_SOURCE : "https://github.com/EnZon-1928/ZharVe1L_Kernel.git"
  KERNEL_BRANCH : "clean-base"

  CLANG_SOURCE : "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/master/clang-r383902.tar.gz"
  CLANG_BRANCH : ""

  GCC_GNU : false
  GCC_64_SOURCE : "https://github.com/KudProject/aarch64-linux-android-4.9.git"
  GCC_64_BRANCH : "master"
  GCC_32_SOURCE : "https://github.com/KudProject/arm-linux-androideabi-4.9.git"
  GCC_32_BRANCH : "master"

  DEFCONFIG_SOURCE: ""
  DEFCONFIG_NAME : "a23_eur_open_defconfig"
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT: false

  KERNELSU_SOURCE : ""
  KERNELSU_BRANCH : ""

  KERNELSU_AUTO_GET : "true"
  KERNELSU_AUTO_FORK : "resukisu"

  SUSFS_ENABLE : true
  SUSFS_FIXED : true

  AK3_SOURCE : "https://github.com/osm0sis/AnyKernel3.git"
  AK3_BRANCH : "master"

  BOOT_SOURCE : ""

  NEED_DTBO : false
  NEED_SAFE_DTBO : false

  ROM_TEXT : "a235f"

  # Other env
  PYTHON_VERSION: "3"
  PACK_METHOD: "Anykernel3"
  PACK_KMODULES: "false"

  KERNELSU_METHOD: "shell"

  PATCHES_SOURCE: "JackA1ltman/NonGKI_Kernel_Patches"
  PATCHES_BRANCH: "samsung_kernel"

  SUSFS_FOLDER_FIXED: "a71_sm7150"
  SUSFS_PATCH_FIXED: "susfs_fixed"

  REKERNEL_ENABLE: "false"
  DROIDSPACES_ENABLE: "false"
  NOMOUNT_ENABLE: "false" # if u need NoMount.

  HOOK_METHOD: "syscall"

  KERNEL_PATCH: "true"

  KPM_ENABLE: "false"
  KPM_INLINE: "false"
  KPM_KPATCH_NEXT: "false"
  KPM_PATCH_SOURCE: "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU_patch/refs/heads/main/kpm/patch_linux"

  BASEBAND_GUARD_ENABLE: "true"
  BASEBAND_GUARD_BOOT: "false"

  GENERATE_DTB: "false"
  GENERATE_CHIP: "qcom"

  BUILD_DEBUGGER: "false"
  SKIP_PATCH: "false"

  BUILD_OTHER_CONFIG: "false"
  MERGE_CONFIG_FILES: "a71.config"

  FREE_MORE_SPACE: "false"
      
jobs:
  build-kernel:
    name: Samsung Galaxy A235F
    runs-on: ubuntu-latest # u can changed to ubuntu 22.04, and need container set ubuntu-latest
    # container: archlinux/archlinux:latest # if u need use arch linux -> archlinux/archlinux:latest or ubuntu 20.04 -> ubuntu:focal
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
      
    steps:
      - name: ⏰ Checkout repository
        uses: actions/checkout@v6 # Đổi thành v4 vì v6 chưa tồn tại, Github Actions có thể báo lỗi

      - name: 🔐 Authenticate Private Repository
        run: |
          git config --global url."https://x-access-token:${{ secrets.PRIVATE_TOKEN }}@github.com/".insteadOf "https://github.com/"
      - name: ⌛️ Compilation environment preparation
        uses: ./.github/workflows/build-env

      - name: ⚙️ Get neccssary tools
        uses: ./.github/workflows/build-ready

      - name: 🪝 Patch Kernel of SUSFS
        uses: ./.github/workflows/patch-susfs

      - name: 🔗 Patch for no-kprobe
        uses: ./.github/workflows/patch-no-kprobe

      - name: 🪛 Extra Kernel Options
        run: |
          # WAJIB masuk ke folder kernel hasil clone sebelum melakukan sed patching
          cd $GITHUB_WORKSPACE/device_kernel
          
          echo "Fixing Samsung Kconfig warnings..."
          sed -i 's/bool "Samsung TN Ramdump Feature"/tristate "Samsung TN Ramdump Feature"/' drivers/samsung/debug/Kconfig
          sed -i '/^choice$/,/^endchoice$/ s/default [yn]//g' drivers/samsung/debug/Kconfig

          echo "Fixing sensors Kconfig help text..."
          sed -i '/config SENSORS_A96T365IF/,/help/ s/^[[:space:]]*help[[:space:]]*$/\thelp\n\t  Enable A96T365IF sensor./' drivers/sensors/Kconfig

          echo "Fixing vbus_notifier Kconfig type redefinition..."
          sed -i 's/tristate "VBUS notifier support"/bool "VBUS notifier support"/' drivers/usb/common/vbus_notifier/Kconfig
      - name: 🧰 Patch Kernel of Re:Kernel
        uses: ./.github/workflows/patch-rekernel

      - name: 💿 Patch Kernel of Droidspaces
        uses: ./.github/workflows/patch-droidspaces

      - name: 🔒 Patch Kernel of Baseband Guard
        uses: ./.github/workflows/patch-baseband-guard

      - name: 🚀 Build Process
        uses: ./.github/workflows/build-process

      - name: 🔩 Pack Process
        run: |
          TIME=$(date +"%Y%m%d%H%M%S")

          cd $GITHUB_WORKSPACE/device_kernel/
          if [[ -d "arch/arm64/configs" ]]; then
            IMAGE_DIR="$GITHUB_WORKSPACE/device_kernel/out/arch/arm64/boot"
          else
            IMAGE_DIR="$GITHUB_WORKSPACE/device_kernel/out/arch/arm/boot"
          fi

          mkdir -p tmp

          if [[ "${{ env.AK3_SOURCE }}" =~ "osm0sis" ]]; then
            sed -i 's|ExampleKernel by osm0sis @ xda-developers|NonGKI Kernel Build by JackAltman @ Github\nHaotic Kernel Build by nduykha @ Github|g' Anykernel3/anykernel.sh
            sed -i 's/do.devicecheck=1/do.devicecheck=0/g' Anykernel3/anykernel.sh
            sed -i 's!BLOCK=/dev/block/platform/omap/omap_hsmmc.0/by-name/boot;!BLOCK=auto;!g' Anykernel3/anykernel.sh
            sed -i 's/IS_SLOT_DEVICE=0;/is_slot_device=auto;/g' Anykernel3/anykernel.sh
            echo "Now using official Anykernel3."
          else
            echo "Now using custom Anykernel3."
          fi

          if [[ -f "$IMAGE_DIR/Image.gz-dtb" ]]; then
            cp -fp $IMAGE_DIR/Image.gz-dtb tmp
            echo "Found Image.gz-dtb !"
          elif [[ -f "$IMAGE_DIR/Image.gz" ]]; then
            cp -fp $IMAGE_DIR/Image.gz tmp
            echo "Found Image.gz !"
          elif [[ -f "$IMAGE_DIR/zImage-dtb" ]]; then
            cp -fp $IMAGE_DIR/zImage-dtb tmp
            echo "Found zImage-dtb (ARMV7A) !"
          elif [[ -f "$IMAGE_DIR/Image" ]]; then
            # gzip -c $IMAGE_DIR/Image > $IMAGE_DIR/Image.gz
            # cp -fp $IMAGE_DIR/Image.gz tmp
            cp -fp $IMAGE_DIR/Image tmp
            echo "Found Image !"
          fi

          if [[ -f "$IMAGE_DIR/dtb.img" ]]; then
            cp -fp $IMAGE_DIR/dtb.img tmp/dtb
            echo "Found dtb.img, converted dtb !"
          elif [ -f "$IMAGE_DIR/dtb" ]; then
            echo "Found DTB!"
            cp -fp $IMAGE_DIR/dtb tmp
          elif [ "${{ env.GENERATE_DTB }}" == "true" ]; then
            if ls $IMAGE_DIR/dts/${{ env.GENERATE_CHIP }}/*.dtb 1> /dev/null 2>&1; then
                DTB_PATH="dts"
            elif ls $IMAGE_DIR/dts/vendor/${{ env.GENERATE_CHIP }}/*.dtb 1> /dev/null 2>&1; then
                DTB_PATH="dts/vendor"
            else
                echo "Not found dts, abort."
                false
            fi

            cat $IMAGE_DIR/$DTB_PATH/${{ env.GENERATE_CHIP }}/*.dtb > $IMAGE_DIR/dtb
            cp -fp $IMAGE_DIR/dtb tmp
            echo "Generated ${{ env.GENERATE_CHIP }} DTB."
          else
            echo "Doesn't found dtb or dtb.img! Your device maybe needn't the file."
          fi

          if [ "${{ env.PACK_KMODULES }}" == "true" ]; then
            echo "Packing kernel modules (.ko)..."
            mkdir -p tmp/modules/vendor/lib/modules
            find $GITHUB_WORKSPACE/device_kernel/out/ -name "*.ko" -exec cp -fp {} tmp/modules/vendor/lib/modules/ \;
            if [ "$(ls -A tmp/modules/vendor/lib/modules/ 2>/dev/null)" ]; then
              echo "Found and copied kernel modules."
            else
              echo "No kernel modules found, skipping."
              rm -rf tmp/modules
            fi
          fi

          cp -rp ./Anykernel3/* tmp
          cd tmp
          7za a -mx9 tmp.zip *
          cd ..

          cp -fp tmp/tmp.zip ${{ env.DEVICE_CODENAME }}-${{ env.ROM_TEXT }}-$TIME-${{ env.PACK_METHOD }}.zip
          rm -rf tmp

          echo "PACK_NAME=${{ env.DEVICE_CODENAME }}-${{ env.ROM_TEXT }}-$TIME-${{ env.PACK_METHOD }}.zip" >> $GITHUB_ENV

      - name: ✏️ Upload Artifacts
        uses: ./.github/workflows/upload-files
